services:
  backend:
    build: ./qianan/server
    ports:
      # 宿主 8100 → 容器 8000：避开 8000 端口常见占用（本地 dev server / 其他项目），
      # 保证浏览器访问地址唯一确定；容器内部仍是 8000（healthcheck 不受影响）
      - "8100:8000"
    # 配置唯一事实源：server/.env（真实网关 / 密钥 / 模型名都在里面，已被 .gitignore 排除）。
    # 旧版这里的 ${BAILIAN_API_KEY:-}、${QIANAN_VL_MODEL:-} 等空值会把 .env 的真实配置
    # "压空"（应用侧 setdefault 不覆盖已存在的空变量 → 静默降级 mock、网关/模型配错），
    # 故改为 env_file 注入；environment: 只保留需要按环境切换的项。
    env_file:
      - ./qianan/server/.env
    environment:
      # 演示默认真实模式（QIANAN_MOCK=0，演示安全）。
      # 离线/无网联调临时切回 mock（二选一）：
      #   QIANAN_MOCK=1 docker compose up --build
      #   export QIANAN_MOCK=1 && docker compose up --build
      # environment: 优先级高于 env_file，宿主不设时稳定为 0，不会被 .env 改写。
      - QIANAN_MOCK=${QIANAN_MOCK:-0}
      # publisher 默认页是 http://localhost:8001（本机历史端口）；容器内后端监听 8000，
      # 必须指回自身，否则 docker 内上架链路（演示主路径）连接必失败
      - MOCK_PAGE_URL=${MOCK_PAGE_URL:-http://localhost:8000/mock/seller-central}
    volumes:
      - ./qianan/server/data:/app/data
      - ./qianan/server/.env:/app/.env:ro
      # /mock/seller-central 页面文件位于 web/public（后端构建上下文之外），
      # 只读挂入容器路径 /web/public（应用按 parents[2]/web/public/... 解析，容器内即 /web/public）
      - ./qianan/web/public:/web/public:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  frontend:
    build:
      context: ./qianan/web
      dockerfile: Dockerfile
      args:
        # NEXT_PUBLIC_* 是构建期内联变量，必须走 build args（写 environment 运行时不生效）
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8100}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
