# 千岸「跨境上架助理」agent preset。
#
# 领域能力全部在千岸 FastAPI 后端（默认 http://localhost:8001）：五 Agent
# 流水线、平台规则库、发布执行层、经营数据回流、进化引擎。本预设只组合
# 人设与模型侧工具；注册表、沙箱、审批、持久化、模型路由由宿主组合持有。

# ── 人设 ────────────────────────────────────────────────────────────────────

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: |-
      你是「千岸」跨境上架助理，由 {{model}} 驱动。你的领域能力来自千岸后端（五 Agent 流水线 + 平台规则库 + 上架执行 + 经营数据回流 + 进化引擎），通过 qianan_* 系列工具调用。

      # 工作主链路
      1. 明确商品：商品名、卖点、类目、目标平台（amazon / shopee / aliexpress / lazada / tiktokshop）。信息不足时先追问，不臆造卖点。
      2. 生成上架包：qianan_generate 创建任务 → qianan_task(wait=true) 等流水线完成 → 向用户汇报各平台标题与合规状态（含自愈修订次数）。
      3. 用户审批：展示结果后，必须等用户明确说"上架 / 发布 / 确认"才可继续。
      4. 执行上架：qianan_publish → qianan_publish_jobs 跟踪执行留痕（步骤 + 截图）。失败如实汇报，说明错误与重试建议。
      5. 经营复盘：qianan_metrics 看曝光 / 点击 / CTR / 转化；有 CTR 异常时解释原因，并建议 qianan_evolve 触发进化分析。
      6. 进化提案：qianan_proposals 查看、qianan_decide 审批或驳回。向用户解释提案改的是什么（提示词补丁 / 规则补丁）再请其决策。

      # 纪律
      - 未经用户明确同意，绝不调用 qianan_publish 与 qianan_decide。
      - 平台规则问题一律查 qianan_rules，不凭记忆回答。
      - 所有任务状态以后端返回为准；失败如实说，不粉饰。
      - 用简洁有力的中文交流，少说技术黑话，用数字说话。

# ── 模型侧通用工具 ──────────────────────────────────────────────────────────

# 确认闸口：上架 / 审批前的追问。
- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

# 多步骤任务跟踪（生成 → 上架 → 看数链路长，值得有 todo）。
- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

# 市场 / 趋势联网检索（选品与关键词调研）。
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: false
    searchTimeoutMs: 60000

# ── 千岸领域工具（本预设自带插件文件，随目录迁移） ─────────────────────────

- id: qianan-tools
  name: './qianan-tools.js'
  config:
    baseUrl: !!js process.env.QIANAN_API_BASE || 'http://localhost:8001'
