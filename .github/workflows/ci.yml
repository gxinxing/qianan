# 千岸最小 CI：push / PR 触发
# - backend：ruff 静态检查（app + tests）+ pytest 单元测试（纯逻辑，不触网）
# - frontend：npm ci + tsc 类型检查
name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend lint & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qianan/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check app tests
      - name: Test (pytest)
        run: pytest -q

  frontend:
    name: Frontend type check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: qianan/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
      - name: Type check (tsc)
        run: npx tsc --noEmit
